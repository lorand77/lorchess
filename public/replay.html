<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorChess — Replay</title>
<link rel="stylesheet" href="/css/styles.css">
<script>
// Paint with the cached scheme before the first frame; theme.js takes over.
try { if (JSON.parse(localStorage.getItem("lorchess.theme")).scheme === "light") document.documentElement.dataset.scheme = "light"; } catch (e) {}
</script>
</head>
<body>
<div class="game">
  <div class="board-wrap">
    <div class="captured" id="capturedTop"></div>
    <div class="board" id="board"></div>
    <div class="captured" id="capturedBottom"></div>
  </div>
  <div class="info">
    <div class="userbar" id="userbar"></div>
    <p class="toplink"><a id="backLink" href="/profile.html#games">← My Games</a></p>
    <h2 id="replayTitle">Replay</h2>
    <p id="replayMeta" class="muted"></p>
    <p id="replayStatus"></p>
    <!-- Game review. LorFish walks the whole game in the engine worker; the
         summary and per-move verdicts appear here when it finishes. -->
    <section id="reviewPanel" class="review">
      <h3>Game review</h3>
      <p class="review-start" id="reviewStart">
        <button id="reviewBtn" class="primary">Review with LorFish</button>
        <select id="reviewDepth" title="Search depth">
          <option value="2" selected>Normal</option>
          <option value="3">Deeper (slower)</option>
        </select>
      </p>
      <p class="review-progress" id="reviewProgress" style="display:none;">
        <span id="reviewProgressText">Analysing…</span>
        <button id="reviewCancel">Cancel</button>
      </p>
      <div id="reviewSummary" style="display:none;"></div>
      <p id="reviewError" class="check-text"></p>
    </section>

    <h3>Moves</h3>
    <div id="history"></div>
    <!-- Verdict on whichever move is currently shown. -->
    <p id="reviewMove" class="review-move" style="display:none;"></p>
    <p id="replayControls">
      <button id="firstBtn" title="Start">⏮</button>
      <button id="prevBtn" title="Previous (←)">◀</button>
      <button id="nextBtn" title="Next (→)">▶</button>
      <button id="lastBtn" title="End">⏭</button>
    </p>
    <p class="muted" style="font-size:12px;">Click a move, or use ← → (Home/End) to step.</p>
  </div>
</div>

<!-- chess.js (served from src/shared) provides Chess + globals; authGuard gates
     the page and renders the user bar. -->
<script src="/js/shell.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/chess.js"></script>
<script src="/js/variants.js"></script>
<script src="/js/gameReview.js"></script>
<script src="/js/replay.js"></script>
</body>
</html>
