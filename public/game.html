<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorChess</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="game">
  <div class="board-wrap">
    <div class="captured" id="capturedTop"></div>
    <div class="board" id="board"></div>
    <div class="captured" id="capturedBottom"></div>
    <div class="promo" id="promo">
      <div class="promo-box">
        <div>Choose Promotion:</div>
        <div class="options" id="promoOptions"></div>
      </div>
    </div>
  </div>
  <div class="info">
    <div class="userbar" id="userbar"></div>
    <p class="toplink"><a href="/lobby.html">← Lobby</a></p>
    <h2 id="gameTitle">LorChess</h2>

    <!-- PvP clocks; hidden in AI mode. Top = opponent, bottom = you. -->
    <div id="clocks" style="display:none;">
      <p class="tc-line" id="tcLine"></p>
      <div class="clock-row">
        <span class="clock-who" id="clockTopWho">Opponent</span>
        <span class="clock" id="clockTop">--:--</span>
      </div>
      <div class="clock-row">
        <span class="clock-who" id="clockBottomWho">You</span>
        <span class="clock" id="clockBottom">--:--</span>
      </div>
    </div>

    <!-- AI-only controls; hidden in PvP (the server fixes color, no depth/undo). -->
    <div id="aiControls">
      <p>Depth:
        <select id="depth">
          <option value="2" selected>2 (~1400)</option>
          <option value="4">4 (~1800)</option>
        </select>
      </p>
      <p>You play as:
        <select id="humanColor">
          <option value="w" selected>White</option>
          <option value="b">Black</option>
        </select>
      </p>
    </div>

    <!-- Player names; hidden in AI games, where "You play as" already says it. -->
    <p id="whiteLabel">White: Human</p>
    <p id="blackLabel">Black: LorFish</p>
    <!-- PvP only: friend control for the opponent (filled by ui.js). -->
    <p id="friendRow" class="friend-row" style="display:none;"></p>
    <p id="turn">Turn: White</p>
    <p id="status"></p>
    <!-- AI only: LorFish failed to move; Retry asks the engine again. -->
    <p id="engineNotice" class="check-text" hidden>
      <span id="engineNoticeText"></span>
      <button id="engineRetry" type="button">Retry</button>
    </p>
    <p id="pvpNotice" class="check-text"></p>
    <p id="reviewLinkWrap" style="display:none;">
      <a id="reviewLink" class="review-link" href="#"></a>
    </p>
    <p id="watchInfo" class="muted small" style="display:none;"></p>
    <p id="pvpControls" style="display:none;">
      <button id="resignBtn">Resign</button>
      <button id="drawBtn">Offer Draw</button>
      <button id="rematchBtn" style="display:none;">Rematch</button>
    </p>
    <!-- One strip serves both draw and rematch offers; ui.js rebinds the
         buttons each time it is shown. -->
    <p id="offerPrompt" class="offer-prompt" style="display:none;">
      <span id="offerText"></span>
      <button id="offerAcceptBtn">Accept</button>
      <button id="offerDeclineBtn">Decline</button>
    </p>
    <h3>PGN</h3>
    <div id="history"></div>
    <!-- PvP + spectator chat; hidden in AI games (see ui.js initChat). Players
         and spectators have separate conversations, so the heading and hint are
         filled in per audience. -->
    <div id="chat" class="chat" style="display:none;">
      <h3 id="chatTitle">Chat</h3>
      <p id="chatAudience" class="chat-audience"></p>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" type="text" maxlength="300" placeholder="Say something…">
        <button type="submit">Send</button>
      </form>
      <p id="chatError" class="lobby-error"></p>
    </div>
    <p id="gameButtons" style="margin-top:12px;">
      <button id="undoBtn">Undo (R)</button>
      <button id="resetBtn">New Game</button>
      <button id="loadFenBtn">Load FEN</button>
    </p>
    <p style="color:var(--text-muted); font-size:12px;">Click or drag a piece to move. While the opponent thinks you can queue one premove; click or right-click the board to cancel it.</p>
  </div>
</div>

<div id="fenPanel" class="fen-modal" role="dialog" aria-modal="true" aria-labelledby="fenTitle">
  <div class="fen-modal-box">
    <h3 id="fenTitle">Load FEN</h3>
    <textarea id="fenText" rows="3"
      placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"></textarea>
    <p>
      <button id="fenLoadBtn">Load</button>
      <button id="fenCancelBtn">Cancel</button>
    </p>
    <div id="fenError" class="fen-error"></div>
  </div>
</div>

<!-- authGuard gates the page. chess.js is served from src/shared (/js); LorFish
     is NOT loaded here — it runs only in the Web Worker. socket.io + net.js are
     used by PvP mode (?id=<gameId>); harmless in AI mode. -->
<script src="/js/shell.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/chess.js"></script>
<script src="/js/variants.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/net.js"></script>
<script src="/js/friends.js"></script>
<script src="/js/boardDrag.js"></script>
<script src="/js/moveSource.js"></script>
<script src="/js/achievementToast.js"></script>
<script src="/js/gameStore.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
