<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorChess — Membership</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="membership-page">
  <h1>Membership</h1>

  <!-- Swapped for the member panel once /api/membership says they're in. -->
  <div id="joinView" style="display:none;">
    <p class="muted small">
      Memberships aren't on sale yet. If you have a promo code, redeem it here —
      each code works once.
    </p>
    <ul class="member-perks">
      <li>🔍 <b>Game review</b> — have LorFish analyse any of your finished games</li>
    </ul>
    <form id="promoForm" class="promo-form" autocomplete="off">
      <label for="promoCode">Promo code</label>
      <input id="promoCode" name="promoCode" type="text" inputmode="numeric"
             maxlength="13" placeholder="123 456 789" spellcheck="false">
      <button type="submit" class="primary" id="promoBtn">Redeem</button>
    </form>
    <p class="auth-error" id="promoError"></p>
  </div>

  <div id="memberView" class="member-card" style="display:none;">
    <p class="member-badge">🎟 Member</p>
    <p class="member-since" id="memberSince"></p>
    <p class="muted small">Thanks for supporting LorChess.</p>
    <ul class="member-perks">
      <li>🔍 <b>Game review</b> — have LorFish analyse any of your finished games</li>
    </ul>
  </div>

  <p class="muted small" id="membershipLoading">Loading…</p>
</div>

<script src="/js/shell.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/membership.js"></script>
</body>
</html>
