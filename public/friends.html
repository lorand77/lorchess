<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorChess — Friends</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="history-page">
  <div class="userbar" id="userbar"></div>
  <p class="toplink"><a href="/lobby.html">← Lobby</a></p>
  <h1>Friends</h1>
  <p class="muted small">
    Challenge a friend at the time control below. Add friends from the
    <a class="nav-link" href="/leaderboard.html">leaderboard</a> or after a game.
  </p>

  <!-- The same offer controls as the lobby, so a challenge from here carries a
       time control rather than silently defaulting. -->
  <div class="offer-form">
    <label for="tcSelect">Time</label>
    <select id="tcSelect"></select>
    <label for="colorSelect">Play as</label>
    <select id="colorSelect">
      <option value="random" selected>Random</option>
      <option value="w">White</option>
      <option value="b">Black</option>
    </select>
    <label class="check"><input type="checkbox" id="ratedCheck" checked> Rated</label>
  </div>

  <p id="friendsError" class="lobby-error"></p>
  <div id="friendRequests"></div>
  <div id="friendList" class="list"></div>
</div>

<script src="/js/shell.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/theme.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/timeControls.js"></script>
<script src="/js/net.js"></script>
<script src="/js/friends.js"></script>
<script src="/js/friendsPage.js"></script>
</body>
</html>
