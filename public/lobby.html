<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorChess — Lobby</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="lobby-shell">

  <!-- Centre: anything demanding an answer first, then play, then who's about. -->
  <main class="lobby-main">
    <div id="rejoin" class="rejoin-box" style="display:none;"></div>
    <div id="incoming"></div>

    <section class="panel">
      <h2>Play</h2>
      <div class="play-modes">
        <button id="quickMatchBtn" class="primary" disabled>Quick Match</button>
        <button id="seekBtn" disabled>Post Challenge</button>
        <a class="mode-link" href="/game.html?mode=ai">▶ Play LorFish</a>
        <span id="matchStatus" class="muted small"></span>
      </div>
      <div class="offer-form">
        <label for="tcSelect">Time</label>
        <select id="tcSelect"></select>
        <label for="colorSelect">Play as</label>
        <select id="colorSelect">
          <option value="random" selected>Random</option>
          <option value="w">White</option>
          <option value="b">Black</option>
        </select>
        <label class="check"><input type="checkbox" id="ratedCheck" checked> Rated</label>
      </div>
      <!-- Material odds; setting one forces the game casual. -->
      <div class="handicap-row">
        <button id="handicapBtn">⚖ Handicap…</button>
        <span id="handicapSummary" class="muted"></span>
        <button id="handicapClear" class="clear-link" style="display:none;">clear</button>
      </div>
      <p id="lobbyError" class="lobby-error"></p>
    </section>

    <section class="panel">
      <h2>Open challenges <span class="count" id="seekCount"></span></h2>
      <div id="seekList" class="list"></div>
    </section>

    <section class="panel">
      <h2>Players online <span class="count" id="playerCount"></span></h2>
      <div id="playerList" class="list"></div>
    </section>
  </main>

  <!-- Right: puzzles, with the daily one as the hero card. -->
  <aside class="lobby-side">
    <section class="panel puzzle-card" id="dailyCard">
      <h2>Daily puzzle</h2>
      <div class="mini-board-wrap"><div id="dailyBoard"></div></div>
      <p class="puzzle-meta" id="dailyMeta"></p>
      <p class="puzzle-streak" id="dailyStreak"></p>
      <a class="puzzle-cta primary" id="dailyCta" href="/puzzles.html?daily">Solve</a>
    </section>

    <section class="panel puzzle-card small" id="trainCard">
      <h2>More puzzles</h2>
      <div class="train-row">
        <div class="mini-board-wrap small"><div id="trainBoard"></div></div>
        <div class="train-meta">
          <p class="puzzle-meta" id="trainMeta"></p>
          <a class="puzzle-cta" id="trainCta" href="/puzzles.html">Train</a>
        </div>
      </div>
    </section>
  </aside>
</div>

<!-- Live games, full width under everything. Removed from the page entirely
     when nothing is in progress (see lobby.js renderGames). -->
<section class="panel live-strip" id="liveStrip" style="display:none;">
  <h2>Live games <span class="count" id="gameCount"></span></h2>
  <div id="gameList" class="live-list"></div>
</section>

<!-- authGuard gates the page; timeControls.js and handicap.js come from
     src/shared, so client and server share one definition of each. -->
<script src="/js/shell.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/theme.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/timeControls.js"></script>
<script src="/js/handicap.js"></script>
<script src="/js/positionEditor.js"></script>
<script src="/js/miniBoard.js"></script>
<script src="/js/net.js"></script>
<script src="/js/friends.js"></script>
<script src="/js/achievementToast.js"></script>
<script src="/js/lobby.js"></script>
</body>
</html>
